<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            background-color: red;
        }
        ul li:last-child{
            background-color: aqua;
        }
        ul li:nth-child(4){
            background-color: lightcoral;
        }
        ul li:nth-child(even){
            background-color: lightgreen;
        }
        ul li:nth-child(odd){
            background-color: lightsalmon;
        }
        .main{
            height: 200px;
            width: 200px;
            border: 2px solid;
             transition: 1s;
        }
        .main:hover{
            background-color: lightcoral;
            transform: translate(100px,100px);
            border-radius: 50%;
           
        }
        input{
            margin-top: 50px;
        }
        input:focus{
            background-color: lightcoral;
            color: white;
        }
    </style>
</head>
<body>
    
    <!-- : class 
    ::  element  -->

    <ul>
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
        <li>Five</li>
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
        <li>Five</li>
    </ul>

    <div class="main">

    </div>

    <!-- prenet apply 
        prenet to child 

    -->

    <input type="text">

</body>
</html>
