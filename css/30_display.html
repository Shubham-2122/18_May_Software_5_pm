<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 500px;
            background-color: lightcoral;
            display: flex;
            flex-direction: row;
            /* flex-direction: row-reverse; */
            /* flex-direction: column; */
            /* flex-direction: column-reverse; */
            justify-content: center;
            /* justify-content: start; */
            /* justify-content: end; */
            align-items: center;
            /* align-items: start; */
            /* align-items: end; */
        }
        .box{
            height: 200px;
            width: 200px;
            border: 2px solid;
        }

        .main2{
            height: 500px;
            background-color: aqua;
            display: flex;
            align-items: center;
            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;
        }
        #box2{
            text-align: center;
            align-content: center;
        }
    </style>

</head>

<body>
    <!-- flex and grid layout
    
        flex : row and col at time 
        grid : row and col both
    -->

    <div class="main">
        <div class="box">1</div>
        <div class="box" id="box2">2</div>
        <div class="box">3</div>
    </div>

     <div class="main2">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
