<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- property :value -->
    <h1 style="color: orange;background-color: aqua;">background-color normal</h1>


    <h1 style="color: #921a1a;">background-color hexa</h1>

    <!-- red,green,blue (0-225) -->
    <h1 style="color: rgb(21, 78, 235);">background-color rgb</h1>

    <!-- a(aplph) , opacity ()0-1 -->
    <h1 style="color: rgb(190, 240, 11);">background-color rgb</h1>
    <h1 style="color: rgba(190, 240, 11,0.6);">background-color rgba</h1>
    <h1 style="color: rgba(245, 114, 7, 0.692);">background-color rgba</h1>

    <!-- hsl -->

    <h1 style="color: hsl(255, 62%, 41%);">background-color hsl</h1>

    <h1 style="color: hsla(255, 62%, 41%,.5);">background-color hsl</h1>
</body>

</html>
